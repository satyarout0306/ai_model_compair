name: LLM Model Benchmark

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Set up Python
      # ----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ----------------------------------------
      # 3. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt


      # ----------------------------------------
      # 4. Install Ollama
      # ----------------------------------------
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh


      # ----------------------------------------
      # 5. Start Ollama
      # ----------------------------------------
      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 10

          ollama list


      # ----------------------------------------
      # 6. Pull benchmark models
      # ----------------------------------------
      - name: Pull LLM models
        run: |
          ollama pull llama3.2:3b
          ollama pull qwen2.5:7b
          ollama pull phi3:mini


      # ----------------------------------------
      # 7. Verify models
      # ----------------------------------------
      - name: Verify models
        run: |
          ollama list


      # ----------------------------------------
      # 8. Run benchmark
      # ----------------------------------------
      - name: Run LLM benchmark
        run: |
          python benchmark_cli.py full \
            --models llama3.2:3b qwen2.5:7b phi3:mini \
            --output benchmark/results \
            --max-retries 3


      # ----------------------------------------
      # 9. Upload benchmark reports
      # ----------------------------------------
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-benchmark-results
          path: |
            benchmark/results/
